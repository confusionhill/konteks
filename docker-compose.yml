version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: konteks-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: konteks
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d konteks"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: konteks-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/secrets:/app/secrets
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/konteks?sslmode=disable
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_S3_BUCKET=contextkit-archive
      - JWT_SECRET=contextkit_super_secret_jwt_key_2026_change_in_prod

  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    container_name: konteks-sidecar
    ports:
      - "8085:8085"
    depends_on:
      app:
        condition: service_started
    environment:
      - CONTEXTKIT_TARGET_URL=http://app:8080
      - CONTEXTKIT_MASTER_KEY=konteks_sample_static_master_key_32b!
      - ENABLE_E2EE=true
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: konteks-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
