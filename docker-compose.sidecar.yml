services:
  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    container_name: konteks-sidecar
    ports:
      - "8085:8085"
    environment:
      - CONTEXTKIT_TARGET_URL=http://konteks-app:8080
      - CONTEXTKIT_MASTER_KEY=konteks_sample_static_master_key_32b!
      - ENABLE_E2EE=true
    restart: unless-stopped
