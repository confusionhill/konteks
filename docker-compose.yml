version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: konteks-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: konteks
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d konteks"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: konteks-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/secrets:/app/secrets
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/konteks?sslmode=disable

volumes:
  pgdata:
